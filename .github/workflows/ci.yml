name: CI

# Fork pull requests run with a read-only token and no secrets: this workflow uses neither.
# Never switch it to `pull_request_target`.
on:
  pull_request:
  push:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Runs without the maintainer's team: ad-hoc "Sign to Run Locally".
      SIGNING: DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build
        run: |
          xcodebuild -scheme whoa-stash -destination 'platform=macOS' \
            -derivedDataPath DerivedData $SIGNING build

      - name: Test
        run: |
          xcodebuild -scheme whoa-stash -destination 'platform=macOS' \
            -derivedDataPath DerivedData $SIGNING test
